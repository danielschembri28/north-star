# Local trial: docker compose up, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:northstar@db:5432/northstar
      MESSAGE_MODE: console
    depends_on:
      db: { condition: service_healthy }
volumes:
  dbdata:
